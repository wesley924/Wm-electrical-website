<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Generate Inspection Report</title>
<meta name="robots" content="noindex, nofollow">
<style>
  body { font-family: -apple-system, Arial, sans-serif; background: #f7f7f7; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
  .card { background: #fff; padding: 32px; border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); width: 100%; max-width: 380px; }
  h1 { font-size: 18px; color: #3a3a3a; margin-bottom: 20px; }
  label { display: block; font-size: 13px; color: #6b6b6b; margin-bottom: 4px; margin-top: 14px; }
  input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; box-sizing: border-box; }
  button { width: 100%; margin-top: 20px; padding: 12px; background: #6faaa5; color: #fff; border: none; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; }
  button:disabled { background: #bcd; cursor: default; }
  .msg { margin-top: 14px; font-size: 13px; color: #b3392f; }
  .msg.success { color: #2f7d74; }
</style>
</head>
<body>
  <div class="card">
    <h1>Generate Inspection Report</h1>
    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="current-password">
        <label for="jobNumber">Job Number</label>
    <input type="text" id="jobNumber" placeholder="e.g. 1042">
    <label style="display:flex; align-items:center; gap:6px; margin-top:14px; font-size:13px; color:#6b6b6b;">
      <input type="checkbox" id="debugMode" style="width:auto;"> Debug mode (show raw data instead of PDF)
    </label>
    <button id="generateBtn">Generate PDF</button>

    <div id="msg" class="msg"></div>
  </div>

<script>
  const btn = document.getElementById('generateBtn');
  const msg = document.getElementById('msg');

  btn.addEventListener('click', async () => {
    const password = document.getElementById('password').value;
    const jobNumber = document.getElementById('jobNumber').value.trim();
    msg.textContent = '';
    msg.className = 'msg';

    if (!password || !jobNumber) {
      msg.textContent = 'Enter both password and job number.';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Generating…';

    try {
            const res = await fetch('/api/generate-report', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ jobNumber, password, debug: document.getElementById('debugMode').checked })
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || 'Something went wrong');
      }

      if (document.getElementById('debugMode').checked) {
        const jsonData = await res.json();
        document.body.innerHTML = '<pre style="padding:20px; font-size:11px; white-space:pre-wrap; word-break:break-all;">' +
          JSON.stringify(jsonData, null, 2).replace(/</g, '&lt;') + '</pre>';
        return;
      }

      const blob = await res.blob();

      const url = URL.createObjectURL(blob);
      window.open(url, '_blank');
      msg.textContent = 'Report generated.';
      msg.className = 'msg success';
    } catch (e) {
      msg.textContent = e.message;
    } finally {
      btn.disabled = false;
      btn.textContent = 'Generate PDF';
    }
  });
</script>
</body>
</html>
